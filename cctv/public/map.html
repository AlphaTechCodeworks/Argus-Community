<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <!-- installable: Add to Home Screen opens Argus full screen, without the browser's bars -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Argus" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e1012" />
  <title>Argus · Map</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/camera-browser.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/review.css" />
</head>
<body class="map-page">
  <!-- the page header (css/components.css). Above the toolbar, not in <main>: here <main> is the map -->
  <header class="page-head"><div class="page-head-text"><h1>Map</h1><p class="page-sub">Every site and where its cameras point</p></div></header>
  <header>
    <div class="brand">
      <h1>CCTV</h1>
    </div>
    <div class="controls">
      <!-- the site to show (filled in by map.js: "All sites", then every site). Beside it, for the site
           chosen: Plan, "Place this site" for an admin, and "← Map" from inside a plan -->
      <div class="map-site-pick">
        <label for="siteSel">Site</label>
        <select id="siteSel" title="Choose a site to fly to it, or All sites"></select>
        <span id="siteActions" class="map-site-actions"></span>
      </div>
      <label class="map-find"><span class="visually-hidden">Find a camera in the list</span><input id="mapCameraSearch" type="search" placeholder="Find cameras in the list…" autocomplete="off" /></label>
      <label title="Satellite pictures instead of the street map"><input id="sat" type="checkbox" /> Satellite</label>
      <label title="Show camera names on the map"><input id="names" type="checkbox" checked /> Camera names</label>
      <button id="edit" type="button" hidden>Edit map</button>
      <button id="links" type="button" hidden title="Say which camera leads to which, so a follow can step from one to the next">Edit links</button>
    </div>
    <div class="account">
      <span id="build" class="build" title="Running build"></span>
      <span id="whoami"></span>
      <button id="logout" type="button">Sign out</button>
    </div>
  </header>

  <main class="map-main">
    <div id="map" class="map-view" tabindex="0" aria-label="Map of every site's cameras. The Site list above and the camera list beside it reach the same sites and cameras.">
      <div class="map-tiles"></div>
      <img class="map-plan" alt="" hidden />
      <svg class="map-overlay" aria-hidden="true"></svg>
      <div class="map-zoom">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" id="fit" aria-label="Fit cameras in view" title="Fit cameras in view">◎</button>
        <button type="button" id="mapFullscreen" aria-label="Full screen map" title="Full screen map" aria-pressed="false">⛶</button>
      </div>
      <div class="map-credit" hidden></div>
      <div id="empty" class="map-empty" hidden></div>
      <div id="live" class="map-live" hidden></div>
    </div>
    <aside id="side" class="map-side" aria-label="Cameras"></aside>
  </main>

  <script type="module" src="shell.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="alert-banner.js"></script>
  <script type="module" src="build-badge.js"></script>
</body>
</html>
